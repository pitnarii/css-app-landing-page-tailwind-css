<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme App</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              Inter: ['Inter', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>
  </head>
 <body class="bg-[#F6F6FB] font-Inter">
    <!-- Aoey -->
     <!-- contact container -->
    <div class="flex justify-center p-[16px] sm:p-[60px] bg-[#F6F6FB]">
    <div class="w-full max-w-[640px] md:max-w-[960px] lg:max-w-[1199px] bg-white flex flex-col gap-[20px] py-[20px] px-[20px] md:py-[48px] md:px-[40px] rounded-[20px] shadow-sm">
      <h2 class="text-[#111] text-center text-[2rem] sm:text-[3rem] font-bold mb-1">Get in Touch</h2>
      <div class="flex flex-col gap-[10px]">
        <label class="text-[#333] text-label">Name</label>
        <input class="border border-[#ddd] rounded-[10px] px-4 py-3 text-[0.9rem] text-[#333] bg-[#fafafa] outline-none" type="text" placeholder="John Doe" />
      </div>
      <div class="flex flex-col gap-[10px]">
        <label class="text-[#333] text-label">Email</label>
        <input class="border border-[#ddd] rounded-[10px] px-4 py-3 text-[0.9rem] text-[#333] bg-[#fafafa] outline-none" type="email" placeholder="john@example.com" />
      </div>
      <div class="flex flex-col gap-[10px]">
        <label class="text-[#333] text-label">Message</label>
        <textarea class="border border-[#ddd] rounded-[10px] px-4 py-3 text-[0.9rem] text-[#333] bg-[#fafafa] outline-none h-[110px] resize-y" placeholder="Your message..."></textarea>
      </div>
      <!-- button -->
      <button class="w-[303px] sm:w-[589px] sm:h-[56px] self-center rounded-[20px] bg-[#111] text-white font-medium text-base px-6 py-4 hover:bg-[#333]">Submit</button>
    </div>
  </div>

  <footer class="flex flex-col items-center gap-3 pt-[40px] pb-[40px] px-[16px] sm:flex-row sm:justify-between sm:items-center sm:px-[240px]">
    <span class="text-center">Acme productivity app ©2024</span>
    <nav class="tracking-[0.2em] flex flex-wrap justify-center gap-[20px] font-semibold sm:justify-end">
      <a href="#">FAQ</a>
      <a href="#">Terms</a>
      <a href="#">AI Policy</a>
      <a href="#">Pricing</a>
    </nav>
  </footer>
  </body>
</html>
